basePath: /
definitions:
  auth.ErrorRes400:
    properties:
      error:
        example: bad request
        type: string
      message:
        example: failed to process...
        type: string
      success:
        example: false
        type: boolean
    type: object
  auth.ErrorRes500:
    properties:
      error:
        example: internal server error
        type: string
      message:
        example: failed to process...
        type: string
      success:
        example: false
        type: boolean
    type: object
  auth.GoogleSignInReq:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  auth.GoogleSignInRes:
    properties:
      accessToken:
        example: xxx...
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      refreshToken:
        example: yyyyyy
        type: string
      username:
        type: string
    type: object
  auth.RefreshTokenReq:
    properties:
      refreshToken:
        example: yyyyy...
        type: string
    required:
    - refreshToken
    type: object
  auth.RefreshTokenRes:
    properties:
      accessToken:
        example: xxx...
        type: string
      refreshToken:
        example: yyyyyy
        type: string
    type: object
  auth.ResendOTPreq:
    properties:
      email:
        example: haidar@gmail.com
        type: string
    required:
    - email
    type: object
  auth.SignInReq:
    properties:
      identifier:
        example: haidar@gmail.com
        maxLength: 320
        minLength: 3
        type: string
      password:
        example: password123
        maxLength: 24
        minLength: 8
        type: string
    required:
    - identifier
    - password
    type: object
  auth.SignInRes:
    properties:
      accessToken:
        example: xxxxx
        type: string
      refreshToken:
        example: yyyyyy
        type: string
    type: object
  auth.SignUpRequest:
    properties:
      email:
        example: haidar@gmail.com
        type: string
      firstName:
        example: Haidar
        maxLength: 24
        minLength: 3
        type: string
      lastName:
        example: Hanif
        maxLength: 24
        minLength: 3
        type: string
      password:
        example: password123
        maxLength: 24
        minLength: 8
        type: string
      username:
        example: haidarIron
        maxLength: 24
        minLength: 3
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    - username
    type: object
  auth.SignUpResponse:
    properties:
      firstName:
        type: string
      id:
        type: integer
      isVerified:
        type: boolean
      lastName:
        type: string
      username:
        type: string
    type: object
  auth.VerifyOTPreq:
    properties:
      email:
        example: haidar@gmail.com
        type: string
      otpCode:
        example: "111111"
        type: string
    required:
    - email
    - otpCode
    type: object
  controllers.ExerciseDelReq:
    properties:
      id:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - id
    type: object
  controllers.ExerciseRequest:
    properties:
      category:
        type: string
      equipment:
        type: string
      muscleGroup:
        type: string
      name:
        type: string
    type: object
  controllers.ExerciseUpdateRequest:
    properties:
      category:
        type: string
      equipment:
        type: string
      id:
        type: integer
      muscleGroup:
        type: string
      name:
        type: string
    required:
    - id
    type: object
  controllers.updateReq:
    properties:
      fullName:
        type: string
      id:
        minimum: 1
        type: integer
      username:
        type: string
    required:
    - id
    type: object
host: api-staging.liftlogs.my.id
info:
  contact: {}
  description: Backend API for IronLog
  title: IronLog Backend Go API
  version: "1.0"
paths:
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: refresh access token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenReq'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshTokenRes'
        "400":
          description: Bad Request
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Refresh Token
      tags:
      - auth
  /api/v1/auth/resendOTP:
    post:
      consumes:
      - application/json
      description: Resend OTP to the email
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendOTPreq'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorRes500'
      security:
      - ApiKeyAuth: []
      summary: Resend OTP
      tags:
      - auth
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and return a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignInReq'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SignInRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorRes500'
      security:
      - ApiKeyAuth: []
      summary: Sign in
      tags:
      - auth
  /api/v1/auth/signout:
    post:
      consumes:
      - application/json
      description: signout to delete the refresh token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenReq'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Sign Out
      tags:
      - auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Signup credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignUpRequest'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.SignUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorRes500'
      security:
      - ApiKeyAuth: []
      summary: Sign Up
      tags:
      - auth
  /api/v1/auth/verifyOTP:
    post:
      consumes:
      - application/json
      description: verify the otp that send to email
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyOTPreq'
      - description: api key
        in: header
        name: x-api-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorRes500'
      security:
      - ApiKeyAuth: []
      summary: Verify OTP
      tags:
      - auth
  /api/v1/exercises:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Exercise data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.ExerciseDelReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Delete exercises
      tags:
      - exercises
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all exercises
      tags:
      - exercises
    patch:
      consumes:
      - application/json
      parameters:
      - description: Exercise data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.ExerciseUpdateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Update a exercise
      tags:
      - exercises
    post:
      consumes:
      - application/json
      parameters:
      - description: Exercise data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.ExerciseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a new exercise
      tags:
      - exercises
  /api/v1/exercises/{id}:
    get:
      parameters:
      - description: Exercise ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a single exercise
      tags:
      - exercises
  /api/v1/routines:
    get:
      consumes:
      - application/json
      description: Get routines owned by the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Get routines
      tags:
      - routines
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create Routine
      tags:
      - routines
  /api/v1/routines/{id}:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: delete routine
      tags:
      - routines
    patch:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Update routine
      tags:
      - routines
  /api/v1/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all users
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: delete a user
      tags:
      - users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a user
      tags:
      - users
    patch:
      parameters:
      - description: user data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.updateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a user
      tags:
      - users
  /auth/google/mobile:
    post:
      consumes:
      - application/json
      description: Authenticate user via Google ID token (mobile flow) and return
        a JWT token
      parameters:
      - description: Google ID Token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleSignInReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns JWT token and user info
          schema:
            $ref: '#/definitions/auth.GoogleSignInRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorRes400'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorRes500'
      summary: Sign in with Google
      tags:
      - auth
  /healthCheck:
    get:
      description: Perform status check to the server
      responses: {}
      summary: Check server status
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-KEY
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
