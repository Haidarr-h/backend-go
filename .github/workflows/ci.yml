name: Go CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded PR runs, but let main (deploy) runs queue so a deploy is
# never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Runs on every PR and every push to main. Gates the deploy below.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^docs/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

  # ---------------------------------------------------------------------------
  # Only after tests pass, and only for pushes to main.
  # ---------------------------------------------------------------------------
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger
        run: swag init -g cmd/api/main.go

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -f dockerfile \
            -t ghcr.io/haidarr-h/backend-go:latest \
            -t ghcr.io/haidarr-h/backend-go:${{ github.sha }} \
            .

      - name: Push Docker image
        run: docker push --all-tags ghcr.io/haidarr-h/backend-go

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/backend-go
            git pull origin main
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f

  # ---------------------------------------------------------------------------
  # Syncs the deployed spec into Apidog. Non-blocking: a docs-sync hiccup must
  # not mark a successful deploy as failed.
  # ---------------------------------------------------------------------------
  sync-apidog:
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Update Apidog Collection
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.liftlogs.my.id/swagger/doc.json)
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i: server not ready (status $STATUS), retrying in 10s..."
            sleep 10
          done

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.apidog.com/v1/projects/${{ secrets.APIDOG_PROJECT_ID }}/import-openapi?locale=en-US" \
            -H "X-Apidog-Api-Version: 2024-03-28" \
            -H "Authorization: Bearer ${{ secrets.APIDOG_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "input": {
                "url": "https://api-staging.liftlogs.my.id/swagger/doc.json"
              },
              "options": {
                "endpointOverwriteBehavior": "OVERWRITE_EXISTING",
                "schemaOverwriteBehavior": "OVERWRITE_EXISTING",
                "updateFolderOfChangedEndpoint": false,
                "prependBasePath": false,
                "deleteUnmatchedResources": true
              }
            }')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Apidog update failed with status $HTTP_STATUS"
            exit 1
          fi
